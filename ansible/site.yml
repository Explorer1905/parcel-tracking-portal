---
# site.yml – Master playbook: provisions infrastructure then deploys the portal.
# Run: ansible-playbook -i inventory.ini site.yml
# Second run must report changed=0 (idempotent).

- name: Provision Parcel Tracking Portal infrastructure
  hosts: parcel_servers
  become: false   # WSL demo runs as current user; set true for a real remote host
  gather_facts: true

  roles:
    - packages
    - service-user
    - app-dirs
    - app-config
    - firewall

- name: Deploy Parcel Tracking Portal
  hosts: parcel_servers
  become: false
  gather_facts: false

  roles:
    - deploy
    - health-check
