---
# roles/app-config/tasks/main.yml
# Renders the .env file from a Jinja2 template; secrets come from ansible-vault
# or extra-vars (--extra-vars "postgres_password=...").
# NEVER store plaintext passwords in this file or in the inventory.

- name: Render .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_config }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"   # read only by owner and group; no world read
  become: true
  no_log: true     # suppress output so password is not logged

- name: Record active release tag
  ansible.builtin.copy:
    content: "{{ release_tag | default('latest') }}"
    dest: "{{ app_base }}/active_release"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
  become: true
