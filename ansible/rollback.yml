---
- name: Roll back the Parcel Tracking Portal to a stable release
  hosts: parcel_nodes
  become: true
  gather_facts: false

  vars:
    docker_executable: /usr/bin/docker
    container_name: parcel-portal-cd
    image_repository: localhost:5000/parcel-tracking-portal
    rollback_tag: "1.0.7"
    host_port: 8082
    health_url: "http://127.0.0.1:{{ host_port }}/parcel-tracking-portal/health"

  tasks:
    - name: Pull the stable rollback release
      ansible.builtin.command:
        cmd: "{{ docker_executable }} pull {{ image_repository }}:{{ rollback_tag }}"
      changed_when: false

    - name: Replace the failed container with the stable release
      ansible.builtin.shell:
        cmd: >-
          {{ docker_executable }} rm -f {{ container_name }} >/dev/null 2>&1 || true;
          {{ docker_executable }} run -d --name {{ container_name }}
          -p {{ host_port }}:8080 {{ image_repository }}:{{ rollback_tag }}
      changed_when: true

    - name: Verify the rollback health endpoint
      ansible.builtin.uri:
        url: "{{ health_url }}"
        status_code: 200
        return_content: true
      register: rollback_health
      until:
        - rollback_health.status == 200
        - rollback_health.content | trim == "OK"
      retries: 30
      delay: 2

    - name: Record rolled-back release
      ansible.builtin.copy:
        dest: /etc/parcel-tracking-portal/active-release
        content: "{{ image_repository }}:{{ rollback_tag }}\n"
        owner: parcel
        group: parcel
        mode: "0640"
