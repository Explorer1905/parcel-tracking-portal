# Ansible inventory for Parcel Tracking Portal
# For the WSL demonstration target is localhost (WSL Ubuntu).
# For a remote host, replace 127.0.0.1 with the target IP and set ansible_user.

[parcel_servers]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[parcel_servers:vars]
# Directories created by the service-user and app-dirs roles
app_base=/opt/parcel-tracking-portal
app_config=/etc/parcel-tracking-portal
app_data=/var/lib/parcel-tracking-portal
app_backup=/var/backups/parcel-tracking-portal
app_user=parcel
app_group=parcel

# Docker Compose project and ports
compose_project=parcel-production
app_port=8082
db_port=5434
registry_host=localhost:5000
image_repo=parcel-tracking-portal

# Health check
health_url=http://localhost:{{ app_port }}/parcel-tracking-portal/health
health_retries=20
health_delay=5
