---
# deploy.yml – Deploy a specific versioned image to the production stack.
#
# Usage:
#   ansible-playbook -i inventory.ini deploy.yml \
#     -e release_tag=1.1.42 \
#     -e postgres_password=secret
#
# The release_tag MUST be a tag published to localhost:5000.
# The database is left untouched (Flyway runs inside the app on startup).

- name: Deploy Parcel Tracking Portal
  hosts: parcel_servers
  become: false
  gather_facts: true

  pre_tasks:
    - name: Validate release_tag is provided
      ansible.builtin.fail:
        msg: "release_tag is required. Use: -e release_tag=1.1.42"
      when: release_tag is not defined or release_tag | length == 0

    - name: Validate postgres_password is provided
      ansible.builtin.fail:
        msg: "postgres_password is required. Use: -e postgres_password=... or --ask-vault-pass"
      when: postgres_password is not defined or postgres_password | length == 0

  roles:
    - app-config   # render .env with new release_tag
    - deploy       # pull image + docker compose up
    - health-check # fail if not healthy within retries
